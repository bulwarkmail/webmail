name: "Lite: Static bundle"

# Bulwark Lite: the static export of the webmail (see docs in README.md,
# "Static Lite build"). Runs the build on every push as a regression check,
# attaches the zips to releases, and lets maintainers build a custom variant
# (fixed server URL, sub-path mount, locale subset, demo) on demand.
#
# Two targets are built side by side:
#   - static:   bulwark-lite-<version>.zip for any static web host;
#   - stalwart: bulwark-lite-stalwart.zip, a Stalwart `Application` bundle.
#               Its LITE-README points `resourceUrl` at the tagged release.
#
# Each zip is published with a `.sha256` next to it and a signed build
# provenance attestation: `gh attestation verify <zip> --repo bulwarkmail/webmail`.
#
# scripts/lite/prepare.mjs deletes the server-only trees in place; that is
# safe here because the Actions checkout is disposable (CI=true is the guard).

on:
  release:
    name: Attach to release
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      jmap_server_url:
        description: "Default JMAP server URL baked into config.json (static: editable after download; stalwart: leave empty for the serving Stalwart)"
        required: false
      app_name:
        description: "App name"
        required: false
        default: "Bulwark Webmail"
      base_path:
        description: "Sub-path mount for the static target, e.g. /webmail (baked into asset URLs; the stalwart target ignores it)"
        required: false
      locales:
        description: "Comma-separated locale subset, e.g. en,de,fr (default: all)"
        required: false
      demo:
        description: "Build the static demo (built-in demo account, no server)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [static, stalwart]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The npm cache only for the checks on pushes and pull requests. Release
      # and manual builds hand out their zips, and any job on main can write
      # the cache, so they install from the registry. An explicit cache: wins
      # over package-manager-cache, which only stops setup-node from turning
      # the cache on by itself when package.json names npm in packageManager.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'npm' || '' }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          CI: "true"
          GIT_COMMIT: ${{ github.sha }}
          LITE_TARGET: ${{ matrix.target }}
          # The Stalwart bundle learns its mount prefix at runtime.
          NEXT_PUBLIC_BASE_PATH: ${{ matrix.target == 'static' && inputs.base_path || '' }}
          LITE_JMAP_SERVER_URL: ${{ inputs.jmap_server_url }}
          LITE_APP_NAME: ${{ inputs.app_name }}
          LITE_LOCALES: ${{ inputs.locales }}
          LITE_DEMO_MODE: ${{ inputs.demo }}
          # Browser source maps for Bugsink; build:lite moves them out of out/
          # before anything is packed. https://bulwarkmail.org/docs/deployment/monitoring
          BULWARK_SOURCE_MAPS: "1"
          SOURCEMAPS_OUT: sourcemaps
        run: npm run build:lite

      # The sourcemaps job sends these to Bugsink; this job never holds the
      # token. Pull requests keep no maps.
      - name: Keep source maps for the upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sourcemaps-lite-${{ matrix.target }}
          path: sourcemaps
          if-no-files-found: error
          retention-days: 1

      # Every host literal in the bundle must be a placeholder, the configured
      # JMAP server, a built-in host the no-third-party switch turns off, or a
      # string listed as never requested (#903).
      - name: Scan the bundle for outside hosts
        run: node scripts/lite/scan-hosts.mjs out

      - name: Package zip
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = "stalwart" ]; then
            # postbuild already packed it (entries at the archive root, no
            # wrapping folder); the name stays version-less on purpose.
            ZIP="bulwark-lite-stalwart.zip"
          else
            if [ "$GITHUB_EVENT_NAME" = "release" ]; then
              VERSION="${REF_NAME#v}"
            else
              VERSION="$(cat VERSION)-${GITHUB_SHA::7}"
            fi
            ZIP="bulwark-lite-${VERSION}.zip"
            (cd out && zip -qr "../${ZIP}" .)
          fi
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"
          ls -la "${ZIP}"

      - name: Check the zip holds no source maps
        run: node scripts/sourcemaps.mjs check "$ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bulwark-lite-${{ matrix.target }}
          path: ${{ env.ZIP }}
          retention-days: 7

  sourcemaps:
    name: Upload source maps
    # The only job with the Bugsink token. It never runs for a pull request,
    # not even from a branch inside this repository, and it builds nothing:
    # the maps come from the build job as artifacts. Each target is its own
    # build with its own chunks, so each folder uploads.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # For scripts/upload-sourcemaps.sh at this commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # sentry-cli for the upload, as package-lock.json locks it. No install
      # script runs: the binary comes in its platform package.
      - name: Install the source map tool
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download source maps (static)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sourcemaps-lite-static
          path: sourcemaps/static

      - name: Download source maps (stalwart)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sourcemaps-lite-stalwart
          path: sourcemaps/stalwart

      - name: Upload source maps to Bugsink
        env:
          BUGSINK_AUTH_TOKEN: ${{ secrets.BUGSINK_AUTH_TOKEN }}
        run: |
          bash scripts/upload-sourcemaps.sh sourcemaps/static
          bash scripts/upload-sourcemaps.sh sourcemaps/stalwart

  release:
    name: Attach to release
    # The only job with a write token, and it runs no checked-out code. It
    # waits for the source maps so a release never ships without them.
    needs: [build, sourcemaps]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bulwark-lite-*
          path: zips
          merge-multiple: true

      - name: Checksum zips
        working-directory: zips
        run: for zip in *.zip; do sha256sum "$zip" > "$zip.sha256"; done

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: zips/*.zip

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" zips/*.zip zips/*.zip.sha256 --clobber

  e2e:
    name: E2E (static)
    # Boots the demo export on a plain static server and drives it with
    # Playwright: login, open a thread, switch surfaces, reload a deep link.
    # No JMAP server involved, so it is cheap and deterministic.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # prepare.mjs prunes every test tree in the checkout; the E2E suite
      # lives under scripts/lite/smoke, which it leaves alone.
      - name: Build demo export
        env:
          CI: "true"
          GIT_COMMIT: ${{ github.sha }}
          LITE_DEMO_MODE: "true"
          LITE_LOCALES: "en,de"
        run: npm run build:lite

      - name: Run E2E test
        run: npm run test:lite-smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lite-e2e-report
          path: playwright-report
          retention-days: 7

  e2e-stalwart:
    name: E2E (Stalwart)
    # The Stalwart Application bundle, served by scripts/lite/serve.mjs
    # --stalwart (an emulation of how Stalwart serves Applications) from the
    # zip itself, under two prefixes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build demo bundle
        env:
          CI: "true"
          GIT_COMMIT: ${{ github.sha }}
          LITE_TARGET: stalwart
          LITE_DEMO_MODE: "true"
          LITE_LOCALES: "en,de"
        run: npm run build:lite

      - name: Run E2E test
        run: npm run test:lite-smoke:stalwart

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lite-e2e-stalwart-report
          path: playwright-report
          retention-days: 7

name: "Standalone: Release tarball"

# The tarballs build without a write token. The release job, which runs no
# checked-out code, publishes each one with a `.sha256` next to it and a
# signed build provenance attestation:
# `gh attestation verify <tarball> --repo bulwarkmail/webmail`.

on:
  release:
    name: Attach to release
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No npm cache: any job on main can write one, and the tarball is
      # published. npm ci installs from the registry against the lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # With browser and server source maps; Turbopack gives every chunk a
      # debug ID. The maps go to Bugsink and never into the tarball.
      # https://bulwarkmail.org/docs/deployment/monitoring
      - name: Build standalone
        env:
          BULWARK_SOURCE_MAPS: "1"
        run: npm run build

      # .next/server holds the server chunks' maps; standalone copies the
      # chunks only. It doesn't ship, but its maps are needed for server frames.
      - name: Move source maps out of the build
        run: node scripts/sourcemaps.mjs collect --out sourcemaps .next/static .next/standalone .next/server

      # Turbopack chunks were not checked for being the same on both
      # platforms, so each one uploads its own.
      - name: Upload source maps to Bugsink
        env:
          BUGSINK_AUTH_TOKEN: ${{ secrets.BUGSINK_AUTH_TOKEN }}
        run: bash scripts/upload-sourcemaps.sh sourcemaps

      - name: Package tarball
        env:
          REF_NAME: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${REF_NAME#v}"
          TARBALL="bulwark-standalone-${VERSION}-linux-${ARCH}.tar.gz"

          mkdir -p bulwark-standalone
          cp -r .next/standalone/. bulwark-standalone/
          cp -r .next/static bulwark-standalone/.next/static
          cp -r public bulwark-standalone/public

          tar -czf "$TARBALL" bulwark-standalone/
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Check the tarball holds no source maps
        run: node scripts/sourcemaps.mjs check "$TARBALL"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-${{ matrix.arch }}
          path: ${{ env.TARBALL }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: standalone-*
          path: tarballs
          merge-multiple: true

      - name: Checksum tarballs
        working-directory: tarballs
        run: for tarball in *.tar.gz; do sha256sum "$tarball" > "$tarball.sha256"; done

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: tarballs/*.tar.gz

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" tarballs/*.tar.gz tarballs/*.tar.gz.sha256 --clobber
